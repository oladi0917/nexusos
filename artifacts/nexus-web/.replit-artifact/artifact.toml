kind = "web"
previewPath = "/nexus-web/"
title = "Nexus Web"
description = "The Nexus fintech web app — a Vite + React + Tailwind port of the Expo mobile app. Includes auth (JWT), dashboard, accounts, transactions, send money, and profile screens served as a standard web SPA."
version = "1.0.0"
id = "artifacts/nexus-web"
router = "path"

[[services]]
name = "web"
paths = [ "/nexus-web/" ]
localPort = 21850

[services.development]
run = "pnpm --filter @workspace/nexus-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexus-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexus-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21850"
BASE_PATH = "/nexus-web/"
